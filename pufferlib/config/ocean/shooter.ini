[base]
package = ocean
env_name = puffer_shooter
policy_name = Policy

[env]
num_envs = 2048

[vec]
num_envs = 1

[train]
total_timesteps = 30_000_000
gamma = 0.987
learning_rate = 0.01
batch_size = 262144
minibatch_size = 8192
project = shooter3
ent_coef = 0.01

[sweep]
method = Protein
metric = episode_return
goal = maximize
downsample = 5
sweep_only = learning_rate, gamma, ent_coef, minibatch_size

[sweep.train.learning_rate]
distribution = log_normal
min = 5e-3
max = 5e-1
scale = auto

[sweep.train.gamma]
distribution = log_normal
min = 0.8
max = 0.999
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 1e-4
max = 1e-1
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 8192
max = 65536
scale = auto